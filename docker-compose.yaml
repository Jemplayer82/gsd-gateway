services:
  gsd-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: gsd-cloud-mcp-gateway:latest
    container_name: gsd-cloud-mcp-gateway
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      PORT: "8787"
      GSD_CLOUD_USER_TOKEN: ${GSD_CLOUD_USER_TOKEN}
      GSD_CLOUD_AUTH_STORE_PATH: /data/auth-store.json

    volumes:
      - gsd-gateway-data:/data

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

    # Traefik labels — remove this block if you use Nginx Proxy Manager or
    # direct port exposure. NPM: add a proxy host pointing to port 8787 on
    # this container's host with a Let's Encrypt cert.
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.gsd-gateway.rule=Host(`gsd.txferguson.net`)"
      - "traefik.http.routers.gsd-gateway.entrypoints=websecure"
      - "traefik.http.routers.gsd-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.gsd-gateway.loadbalancer.server.port=8787"

volumes:
  gsd-gateway-data:
    driver: local

networks:
  default:
    name: gsd-gateway-net
