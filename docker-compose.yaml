services:
  gsd-gateway:
    image: ghcr.io/jemplayer82/gsd-cloud-mcp-gateway:latest
    container_name: gsd-cloud-mcp-gateway
    restart: unless-stopped

    ports:
      - "8787:8787"

    environment:
      PORT: "8787"
      GSD_CLOUD_USER_TOKEN: ${GSD_CLOUD_USER_TOKEN}
      GSD_CLOUD_AUTH_STORE_PATH: /data/auth-store.json

    volumes:
      - gsd-gateway-data:/data

    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8787/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  gsd-gateway-data:
    driver: local
